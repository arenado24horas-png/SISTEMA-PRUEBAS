<!DOCTYPE html>

<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Arial,Helvetica,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--ac);color:#fff;border-bottom:4px solid var(--yl)}
h1{font-size:19px;margin:0}
.debt{background:var(--yl);color:#000;border-radius:6px;padding:7px 14px;font-weight:700;transition:transform .3s}
.debt.pop{transform:scale(1.08)}
.note{padding:10px 16px;color:var(--mut);font-size:13px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;padding:6px 12px;transition:transform .12s}
button:active{transform:scale(.95)}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.y{background:var(--yl);border-color:#000;color:#000;font-weight:700}
button.d{color:var(--red)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;padding:0 16px 20px;align-items:start}
.col{border:1px solid var(--bd);border-radius:8px;padding:0 10px 4px;min-height:110px;background:color-mix(in srgb,var(--bd) 20%,transparent)}
.col h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;background:var(--ac);color:#fff;margin:0 -10px 10px;padding:7px 10px;border-radius:7px 7px 0 0;display:flex;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:6px;padding:11px;margin-bottom:10px;transition:transform .3s ease,opacity .3s ease}
.card.in{animation:in .4s ease}
.card.out{transform:translateX(36px);opacity:0}.card.back{transform:translateX(-36px);opacity:0}.card.gone{transform:scale(.8);opacity:0}
@keyframes in{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
.m{color:var(--mut);font-size:13px;margin-top:2px}
.pr{font-weight:700;color:var(--ac);margin-top:6px}
.tag{display:inline-block;font-size:12px;border-radius:4px;padding:2px 8px;margin-top:6px;background:var(--bg);color:var(--mut)}
.tag.debt2{background:var(--yl);color:#000;font-weight:700;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.65}}
.act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;animation:in .25s ease}
.ask{margin-top:10px;font-size:13px;animation:in .25s ease}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;animation:in .25s ease}
.fl{display:block;font-size:11px;color:var(--mut)}.fl.wide{grid-column:1/-1}
input,select{width:100%;font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin-top:2px}
.ir{display:grid;grid-template-columns:1fr 1fr 1fr 30px;gap:6px;margin-top:8px;padding:8px;border:1px dashed var(--bd);border-radius:6px;animation:in .25s ease}
.ir .w{grid-column:1/-1}.ir button{padding:0}
.its{margin-top:10px}.its>button{margin-top:8px;width:100%;border-style:dashed;color:var(--ac);font-weight:700}
.tt{font-size:12px;margin-top:6px;color:var(--mut);text-align:right}
.gs{font-size:12px;background:rgba(255,255,255,.2);border-radius:6px;padding:5px 10px}
.empty{color:var(--mut);font-size:13px;padding:4px}
.foot{padding:0 16px 32px}
.panel{max-height:0;opacity:0;overflow:hidden;transition:max-height .5s ease,opacity .35s ease,margin .35s}
.panel.open{max-height:2400px;opacity:1;margin-top:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.bar select{width:auto;max-width:100%}
/* documento (siempre claro, estilo plantilla) */
.doc{background:#fff;color:#000;border:1px solid #000;font-size:12px;max-width:760px}
.dh{display:flex;align-items:center;gap:14px;padding:12px;border-bottom:1px solid #000}
.bdg{flex:none;width:86px;height:86px;border-radius:50%;background:#0070c0;border:5px solid #f2b705;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:1.1}
.bdg b{font-size:15px;letter-spacing:1px}.bdg small{font-size:9px;background:#f2b705;color:#000;padding:0 5px;border-radius:2px}
.dh .c{flex:1;text-align:center}.dh .c b{font-size:17px}.dh .c div{margin-top:3px}
.pn{font-weight:700;padding:3px 6px;border-bottom:1px solid #000}
.inf{display:grid;grid-template-columns:1.5fr 1fr}.inf>div{padding:6px 8px}
.inf .r{background:#0070c0;color:#fff}.inf p{margin:3px 0}.inf span{display:inline-block;min-width:70px;opacity:.85}
table{width:100%;border-collapse:collapse}
td,th{border:1px solid #000;padding:3px 6px}
th{background:#fff;font-weight:700}.tb td{background:#0070c0;color:#fff;font-weight:700}
.n{text-align:right;white-space:nowrap}
.tot td.l{text-align:right;font-weight:700}.tot td.v{background:#0070c0;color:#fff;font-weight:700;text-align:right;white-space:nowrap}
.tot.s td.v{background:#ffff00;color:#000}
.cons{padding:6px 10px;border:1px solid #000;border-top:0}.cons u{font-weight:700}.cons p{margin:3px 0 3px 14px}
.cu{background:#ffff00;text-align:center;font-weight:700;padding:3px;border:1px solid #000;border-top:0}
.ac{display:grid;grid-template-columns:1.4fr 1fr;border:1px solid #000;border-top:0}.ac div{padding:6px 10px;font-weight:700}
.ac i{display:flex;align-items:center;justify-content:center;font-weight:700}
.cf{background:#0070c0;color:#fff;text-align:center;font-weight:700;padding:10px;border:1px solid #000;border-top:0}
@media print{body>*:not(.foot),.foot>*:not(.panel),.bar{display:none}.foot{padding:0}.panel{max-height:none;opacity:1}.doc{border:0;max-width:none}}
</style>
</head>

<datalist id="sug"><option value="Servicio de arenado al metal blanco"><option value="Pintura epóxica"><option value="Pintura de acabado"><option value="Limpieza y desengrase"><option value="Mano de obra"><option value="Materiales e insumos"><option value="Transporte / flete"><option value="Certificado de calidad"></datalist>
<datalist id="att"></datalist>
<script>
(function(){
var E={name:"ARENADO 24 HORAS SAC",ruc:"20611755407",ofi:"Edificio Anglo Peruano 7mo Piso - Centro de Lima",sede:"Calle Los Alisos - Los Alamos - Puente Piedra",telf:"976476902",
cuentas:["CTA BBVA SOLES : 00110752380200509926","CCI BBVA 01175200020050992638","CTA INTERBANK SOLES : 200-3005790547","CTA DE DETRACCION : 00026082293"],
consid:["No incluye flete","Trabajo segun especificaciones enviadas por el cliente","Supervision de calidad permanente","Los trabajos se realizaran en nuestra planta","Incluye certificado de calidad"]};
var COLS=[["pedido","1 · Pedidos"],["desarrollo","2 · Desarrollo"],["cumplimiento","3 · Cumplimiento"],["cobrado","4 · Cerrados"]];
var NEWF=[["name","Cliente (Sres.) *","text","",1],["ruc","RUC"],["atencion","Atención"],["tel","Telf."],["correo","Correo","email","",1]];
var DEVA=[["num","N° presupuesto","text","0000 - 00"],["elab","Elaborado por"],["proyecto","Proyecto","text","",1]];
var DEVB=[["adelanto","Adelanto recibido (S/)","number","0"],["terminos","Términos","text","",1]];
var items=[],ui=null,n=0,shown=0,busy=false;
var $=function(s){return document.querySelector(s)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function num(v){return Number(v).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})}
function money(v){return "S/. "+num(v||0)}
function calc(i){var s=(i.items||[]).reduce(function(a,t){return a+t.qty*t.pu},0),g=s*.18,t=s+g,a=Number(i.adelanto)||0;return{sub:s,igv:g,tot:t,adel:a,sal:Math.max(0,t-a)}}
function pending(){return items.filter(function(i){return i.status==="cumplimiento"&&i.done})}
function debt(){return pending().reduce(function(s,i){return s+calc(i).sal},0)}
function today(){var d=new Date(),p=function(x){return String(x).padStart(2,"0")};return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()}

function tween(to){var from=shown,t0=performance.now(),d=$("#debt");d.classList.add("pop");setTimeout(function(){d.classList.remove("pop")},300);
(function f(t){var k=Math.min(1,(t-t0)/450);shown=from+(to-from)*k;d.textContent="Deuda pendiente: "+money(shown);if(k<1)requestAnimationFrame(f)})(t0)}

function render(enterId){
  var b=$("#board");b.textContent="";
  COLS.forEach(function(c){
    var list=items.filter(function(i){return i.status===c[0]});
    var s=el("section","col"),h=el("h2");h.appendChild(el("span",null,c[1]));h.appendChild(el("span",null,String(list.length)));s.appendChild(h);
    if(!list.length)s.appendChild(el("div","empty","—"));
    list.forEach(function(i){var k=card(i);if(i.id===enterId)k.classList.add("in");s.appendChild(k)});
    b.appendChild(s);
  });
  var dd=debt();if(Math.abs(dd-shown)>0.001)tween(dd);
  if($("#panel").classList.contains("open"))fillSel();
}
function go(i,patch,cls){
  if(busy)return;busy=true;
  var e=document.querySelector('[data-id="'+i.id+'"]');if(e)e.classList.add(cls||"out");
  setTimeout(function(){if(patch===null)items=items.filter(function(x){return x!==i});else Object.assign(i,patch);ui=null;busy=false;render(patch===null?null:i.id)},300);
}
function setUi(i,m){ui={id:i.id,mode:m};render()}
function form(d,defs,v){var g=el("div","g2"),r={};defs.forEach(function(f){var w=el("label","fl"+(f[4]?" wide":""));w.appendChild(el("span",null,f[1]));var x=el("input");x.type=f[2]||"text";if(f[2]==="number"){x.step="any";x.min="0"}x.placeholder=f[3]||"";x.value=v&&v[f[0]]!=null?v[f[0]]:"";w.appendChild(x);g.appendChild(w);r[f[0]]=x});d.appendChild(g);return r}

function itemsEd(d){
  var box=el("div","its"),rows=[],tot=el("div","tt"),add=el("button",null,"+ Agregar ítem");
  box.appendChild(el("div","m","Descripción / ítems del servicio *"));
  function upd(){var s=rows.reduce(function(a,o){return a+(parseFloat(o.q.value)||0)*(parseFloat(o.p.value)||0)},0);tot.textContent="Subtotal "+money(s)+" · IGV "+money(s*.18)+" · Total "+money(s*1.18)}
  function addRow(){
    var r=el("div","ir"),o={r:r};
    function mk(ph,type,cls,val){var x=el("input",cls);x.placeholder=ph;x.type=type;if(type==="number"){x.step="any";x.min="0"}if(val)x.value=val;r.appendChild(x);return x}
    o.w=mk("Descripción (ej. servicio, material, mano de obra)","text","w");o.w.setAttribute("list","sug");
    o.q=mk("Cant.","number");o.u=mk("Und.","text",null,"UND");o.p=mk("P.U. S/","number");
    var x=el("button","d","✕");x.title="Quitar ítem";x.onclick=function(){if(rows.length<2)return;rows.splice(rows.indexOf(o),1);r.remove();upd()};r.appendChild(x);
    rows.push(o);box.insertBefore(r,add);upd();return o;
  }
  add.onclick=function(){addRow().w.focus()};
  box.appendChild(add);box.appendChild(tot);box.oninput=upd;addRow();d.appendChild(box);
  return{get:function(){
    var out=[];
    for(var k=0;k<rows.length;k++){var o=rows[k],q=parseFloat(o.q.value),p=parseFloat(o.p.value);
      if(!o.w.value.trim()){o.w.focus();return null}if(!(q>0)){o.q.focus();return null}if(isNaN(p)||p<0){o.p.focus();return null}
      out.push({work:o.w.value.trim(),qty:q,und:o.u.value.trim()||"UND",pu:p})}
    return out}};
}
function card(i){
  var d=el("div","card");d.dataset.id=i.id;
  var mode=ui&&ui.id===i.id?ui.mode:null,a=el("div","act");
  function btn(t,cls,fn){var x=el("button",cls,t);x.onclick=fn;a.appendChild(x)}
  function ask(txt,fn){d.appendChild(el("div","ask",txt));btn("Sí, confirmar","p",fn);btn("Cancelar",null,function(){ui=null;render()})}
  if(mode==="name"){
    var f=form(d,NEWF,i);f.atencion.setAttribute("list","att");setTimeout(function(){f.name.focus()},0);
    btn("Guardar","p",function(){if(!f.name.value.trim()){f.name.focus();return}Object.keys(f).forEach(function(k){i[k]=f[k].value.trim()});ui=null;render();gsSave(i)});
    btn("Cancelar",null,function(){if(!i.name)items=items.filter(function(x){return x!==i});ui=null;render()});
    d.appendChild(a);return d;
  }
  d.appendChild(el("b",null,i.name));
  if(i.ruc)d.appendChild(el("div","m","RUC "+i.ruc));
  if(i.gs)d.appendChild(el("div","m",i.gs==="ok"?"✓ Guardado en Google Sheets":i.gs==="wait"?"Guardando en Google Sheets…":"⚠ No se guardó en Sheets"+(i.gsMsg?" ("+i.gsMsg+")":"")));
  if(i.items)i.items.forEach(function(t){d.appendChild(el("div","m","• "+t.work+" · "+t.qty+" "+t.und))});
  var c=i.status!=="pedido"?calc(i):null;
  if(c)d.appendChild(el("div","pr","Total "+money(c.tot)+(c.adel?" · Saldo "+money(c.sal):"")));
  if(mode==="dev"){
    var w1=form(d,DEVA),ed=itemsEd(d),w2=form(d,DEVB,{terminos:"50% Adelanto y 50% Contra entrega"});
    btn("Confirmar y pasar →","p",function(){
      var it=ed.get();if(!it)return;
      var o={status:"desarrollo",items:it,work:it.map(function(t){return t.work}).join(" / "),adelanto:parseFloat(w2.adelanto.value)||0};
      ["num","elab","proyecto"].forEach(function(k){o[k]=w1[k].value.trim()});o.terminos=w2.terminos.value.trim();go(i,o);
    });btn("Cancelar",null,function(){ui=null;render()});
  }else if(mode==="del"){ask(i.status==="pedido"?"¿Eliminar? No prosigue.":i.status==="desarrollo"?"¿Eliminar este trabajo acordado? Se pierde el precio y el detalle.":i.status==="cumplimiento"?"¿Eliminar este trabajo en ejecución? Aún no genera deuda.":"¿Eliminar este registro cerrado? Saldrá del resumen de cobranza.",function(){go(i,null,"gone")});
  }else if(mode==="cum"){ask("¿Pasa a cumplimiento?",function(){go(i,{status:"cumplimiento",done:false})});
  }else if(mode==="done"){ask("¿Trabajo terminado? Se registrará la deuda de "+money(c.sal)+" (incluye IGV).",function(){go(i,{done:true},"gone")});
  }else if(mode==="paid"){ask("La deuda solo se elimina si confirmas que prosigue.",function(){go(i,{status:"cobrado"})});
  }else if(i.status==="pedido"){
    btn("Pasar a desarrollo →","p",function(){setUi(i,"dev")});btn("Eliminar","d",function(){setUi(i,"del")});
    if(i.gs==="err"||i.gs==="off"){if(mcp)btn("Reintentar Sheets",null,function(){gsSave(i)});btn("Copiar fila",null,function(){copyRow(i)})}
  }else if(i.status==="desarrollo"){
    btn("A cumplimiento →","p",function(){setUi(i,"cum")});btn("← Volver",null,function(){go(i,{status:"pedido"},"back")});btn("Eliminar","d",function(){setUi(i,"del")});
  }else if(i.status==="cumplimiento"){
    if(!i.done){d.appendChild(el("span","tag","En ejecución"));
      btn("Trabajo terminado ✓","p",function(){setUi(i,"done")});btn("← Volver",null,function(){go(i,{status:"desarrollo"},"back")});btn("Eliminar","d",function(){setUi(i,"del")});
    }else{d.appendChild(el("span","tag debt2","Deuda pendiente"));btn("Prosigue →","p",function(){setUi(i,"paid")})}
  }else{d.appendChild(el("span","tag","Cobrado"));btn("Eliminar","d",function(){setUi(i,"del")})}
  if(a.children.length)d.appendChild(a);
  return d;
}
/* ---------- Google Sheets (conector del usuario) ---------- */
var SHEET={id:"1B6wR-tO_ChCoeDWXyXeoJG37bmzW_pTOh3T_DoBi1Dg",tab:"Hoja 1",hdr:4,first:7,srv:"Google Sheets"},mcp=null,nextRow=SHEET.first;
function setGs(t){$("#gs").textContent=t}
async function gsArgs(tool,x){
  var d=await mcp.describeTool(SHEET.srv,tool),pr=(d.inputSchema&&d.inputSchema.properties)||{},o={};
  Object.keys(pr).forEach(function(k){var l=k.toLowerCase();
    if(/spreadsheet/.test(l)&&/id/.test(l))o[k]=SHEET.id;
    else if(/range/.test(l))o[k]=x.range;
    else if(/^values?$/.test(l)&&x.values)o[k]=x.values;
    else if(/input/.test(l)&&/option/.test(l))o[k]="RAW"});
  if(!Object.keys(o).length)throw new Error("esquema no reconocido");
  return o;
}
function gsVals(r){
  var s=r.structuredContent||r.payload;if(s&&s.values)return s.values;
  var t=(r.content||[]).filter(function(c){return c.type==="text"}).map(function(c){return c.text}).join("");
  try{var j=JSON.parse(t);return j.values||j}catch(e){return null}
}
async function gsRead(){
  var r=await mcp.callTool(SHEET.srv,"get_values",await gsArgs("get_values",{range:"'"+SHEET.tab+"'!B"+SHEET.hdr+":F500"}));
  var v=gsVals(r);if(!Array.isArray(v))throw new Error("respuesta no reconocida");
  var last=0,att={};
  v.forEach(function(row,k){if(row&&row.some(function(c){return String(c||"").trim()}))last=k;
    if(SHEET.hdr+k>=SHEET.first&&row&&row[2])att[row[2]]=1});
  nextRow=Math.max(SHEET.hdr+last+1,SHEET.first);
  var dl=$("#att");dl.textContent="";Object.keys(att).forEach(function(a){var o=el("option");o.value=a;dl.appendChild(o)});
}
async function gsInit(){
  try{
    if(typeof claude==="undefined"||!(mcp=await claude.use("mcp"))){mcp=null;setGs("⚠ Sheets sin conexión");return}
    await gsRead();setGs("📗 Conectado a Google Sheets");
  }catch(e){setGs(e&&e.code==="server_not_connected"?"⚠ Conecta Google Sheets en Claude":"⚠ Sheets: "+((e&&e.message)||"error"))}
}
async function gsSave(i){
  if(!mcp){i.gs="off";render();return}
  i.gs="wait";render();
  try{
    await gsRead();var n=nextRow;
    await mcp.callTool(SHEET.srv,"update_values",await gsArgs("update_values",{range:"'"+SHEET.tab+"'!B"+n+":F"+n,values:[[i.name,i.ruc||"",i.atencion||"",i.tel||"",i.correo||""]]}));
    i.gs="ok";setGs("📗 Conectado a Google Sheets");
  }catch(e){i.gs="err";i.gsMsg=(e&&(e.message||e.code))||"error"}
  render();
}
function copyRow(i){
  var t=["",i.name,i.ruc||"",i.atencion||"",i.tel||"",i.correo||""].slice(1).join("\t");
  var fb=function(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).catch(fb);else fb();
  setGs("Fila copiada: pégala en B"+nextRow+" del Sheets");
}
$("#add").onclick=function(){if(busy)return;var i={id:"c"+(++n),name:"",status:"pedido"};items.unshift(i);ui={id:i.id,mode:"name"};render(i.id)};

/* ---------- plantilla de cobranza ---------- */
function fillSel(){
  var s=$("#sel"),p=pending(),old=s.value;s.textContent="";
  if(p.length>1){var o=el("option",null,"Todos los pendientes ("+p.length+")");o.value="all";s.appendChild(o)}
  p.forEach(function(i){var o=el("option",null,i.name+" — "+i.work);o.value=i.id;s.appendChild(o)});
  if([].some.call(s.options,function(o){return o.value===old}))s.value=old;
  showDoc();
}
function sel(){var p=pending(),v=$("#sel").value;return v==="all"||!v?p:p.filter(function(i){return i.id===v})}
function showDoc(){var b=$("#docbox");b.textContent="";var l=sel();if(!l.length){b.appendChild(el("div","empty","No hay deudas pendientes: aún no hay trabajos terminados sin cobrar."));return}b.appendChild(buildDoc(l))}
function T(tag,cls,txt,kids){var e=el(tag,cls,txt);(kids||[]).forEach(function(k){e.appendChild(k)});return e}
function buildDoc(l){
  var one=l.length===1,x=l[0],S={sub:0,igv:0,tot:0,adel:0,sal:0};
  l.forEach(function(i){var c=calc(i);for(var k in S)S[k]+=c[k]});
  var d=el("div","doc");
  d.appendChild(T("div","dh",null,[T("div","bdg",null,[T("b",null,"ARENADO"),T("small",null,"24 HORAS")]),
    T("div","c",null,[T("b",null,E.name),T("div",null,"RUC :"+E.ruc),T("div",null,"Oficina Principal: "+E.ofi),T("div",null,"Sede 1: "+E.sede)])]));
  d.appendChild(el("div","pn","Presupuesto "+(one&&x.num?x.num:"—")+"  ·  ESTADO DE CUENTA / COBRANZA"));
  function P(a,b){return T("p",null,null,[T("span",null,a),document.createTextNode(b||"")])}
  d.appendChild(T("div","inf",null,[
    T("div",null,null,[P("Sres:",one?x.name:"Varios clientes"),P("RUC:",one?x.ruc:""),P("Atención:",one?x.atencion:""),P("Telf.",one?x.tel:""),P("Correo:",one?x.correo:""),P("Proyecto:",one?(x.proyecto||x.work):"Varios")]),
    T("div","r",null,[P("Fecha",today()),P("Términos",one?x.terminos:""),P("Elaborado",one?x.elab:""),P("Telf",E.telf)])]));
  var t=el("table"),th=el("tr");["Item","Descripción","Cantidad","Und.","P. U.","P.P"].forEach(function(h){th.appendChild(el("th",null,h))});t.appendChild(th);
  l.forEach(function(i,k){
    var tb=el("tr","tb"),c=calc(i);tb.appendChild(el("td",null,String(k+1)));var tt=el("td",null,(one?"":i.name+" · ")+(i.proyecto||i.items[0].work));tt.colSpan=5;tb.appendChild(tt);t.appendChild(tb);
    i.items.forEach(function(it){var r=el("tr");r.appendChild(el("td"));r.appendChild(el("td",null,it.work));
      [num(it.qty),it.und,"S/ "+num(it.pu),"S/ "+num(it.qty*it.pu)].forEach(function(v){r.appendChild(el("td","n",v))});t.appendChild(r)});
  });
  [["SUBTOTAL",S.sub],["IGV",S.igv],["TOTAL",S.tot],["ADELANTO RECIBIDO",S.adel],["SALDO A PAGAR",S.sal]].forEach(function(r,j){
    var tr=el("tr","tot"+(j>2?" s":"")),a=el("td","l",r[0]);a.colSpan=5;tr.appendChild(a);tr.appendChild(el("td","v",money(r[1])));t.appendChild(tr)});
  d.appendChild(t);
  var cs=el("div","cons");cs.appendChild(T("u",null,"Consideraciones de la oferta:"));
  E.consid.forEach(function(c,j){cs.appendChild(el("p",null,String.fromCharCode(97+j)+") "+c))});d.appendChild(cs);
  d.appendChild(el("div","cu","CUENTAS DE DEPOSITO"));
  d.appendChild(T("div","ac",null,[T("div",null,null,E.cuentas.map(function(c){return el("p",null,c)})),el("i",null,"Dpto. Costos y presupuestos")]));
  d.appendChild(el("div","cf","¡CONFIA EN LOS EXPERTOS!"));
  return d;
}
function msg(l){
  var L=["Estimados "+(l.length===1?l[0].name:"señores")+": les recordamos el saldo pendiente de pago.",""];
  l.forEach(function(i){var c=calc(i);L.push("• "+(i.num?"Presupuesto "+i.num+" – ":"")+i.work+" ("+i.name+"): total "+money(c.tot)+", adelanto "+money(c.adel)+", saldo "+money(c.sal))});
  L.push("","TOTAL A PAGAR: "+money(l.reduce(function(s,i){return s+calc(i).sal},0)),"","Cuentas de depósito:");E.cuentas.forEach(function(c){L.push(c)});
  L.push("","Gracias. — "+E.name+" · Telf. "+E.telf);return L.join("\n");
}
$("#sum").onclick=function(){fillSel();$("#panel").classList.add("open");setTimeout(function(){$("#panel").scrollIntoView({behavior:"smooth",block:"start"})},200)};
$("#sel").onchange=showDoc;
$("#hide").onclick=function(){$("#panel").classList.remove("open")};
$("#print").onclick=function(){try{window.print()}catch(e){}};
$("#copy").onclick=function(){
  var b=$("#copy"),l=sel();if(!l.length)return;var t=msg(l),ok=function(){b.textContent="¡Copiado ✓!";setTimeout(function(){b.textContent="Copiar mensaje"},1500)};
  var fb=function(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();ok()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();
};
