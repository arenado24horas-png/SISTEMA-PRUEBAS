<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a365d"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="preconnect" href="https://script.google.com"><title>Bloc de pedidos · Arenado 24 Horas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- MODAL DE LOGIN / REGISTRO -->
<div id="login-overlay">
  <div class="login-box">
    <h2 id="l-title">Iniciar Sesión</h2>
    <div class="m" id="l-desc" style="text-align:center;margin-bottom:16px;">Acceso al sistema centralizado</div>
    
    <label class="fl"><span>Usuario</span><input type="text" id="l-user" placeholder="Ej. ANGIE"></label>
    <label class="fl" style="margin-top:10px"><span>Contraseña</span><input type="password" id="l-pass" placeholder="••••••"></label>
    
    <div id="register-fields" style="display:none; margin-top:10px;">
      <label class="fl" style="margin-bottom:10px"><span>Código de administrador</span><input type="password" id="l-code" placeholder="Código secreto"></label>
      <label class="fl"><span>Nivel de Acceso</span>
        <select id="l-access">
          <option value="TOTALIDAD DE LA PAGINA">Totalidad (Admin)</option>
          <option value="REGISTRO DE CLIENTES Y ENVIADO A DESARROLLO">Solo Registro</option>
          <option value="SOLO DESARROLLO Y CUMPLIMIENTO">Solo Desarrollo</option>
        </select>
      </label>
    </div>

    <button class="p" id="l-btn" style="width:100%;margin-top:20px" disabled>Verificando conexión...</button>
    <div class="login-err" id="l-err"></div>
    <div class="login-toggle" id="l-toggle">Crear nueva cuenta</div>
  </div>
</div>

<header>
  <h1>Arenado 24 Horas <span id="current-user" title="Cerrar Sesión"></span></h1>
  <div class="header-actions">
    <div id="debt" class="debt">Deuda: S/. 0,00</div>
    <button class="y" id="add">Nuevo Pedido</button>
    <button id="sync-btn" title="Refrescar datos">Actualizar</button>
    <button id="theme-btn" title="Cambiar tema">Tema Oscuro</button>
  </div>
</header>

<div class="note">
  <span>Gestión operativa en vivo. El autocompletado de clientes está activado.</span>
  <span class="gs-status" id="gs">Iniciando sistema...</span>
</div>

<div class="board" id="board"></div>

<div class="foot">
  <button class="p" id="sum" style="font-size: 16px; padding: 10px 20px;">Generar Resumen de Cobranza</button>
  <div class="panel" id="panel">
    <div class="bar">
      <select id="sel"></select>
      <button class="p" id="print">Imprimir / PDF</button>
      <button id="copy">Copiar Texto</button>
      <button class="d" id="hide">Cerrar</button>
    </div>
    <div id="docbox"></div>
  </div>
</div>

<datalist id="clients-list"></datalist>
<datalist id="sug">
  <option value="Servicio de arenado al metal blanco">
  <option value="Servicio de arenado comercial">
  <option value="Pintura epóxica">
  <option value="Pintura de acabado">
  <option value="Limpieza y desengrase">
  <option value="Mano de obra">
  <option value="Transporte / flete">
  <option value="Certificado de calidad">
</datalist>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js")</script>
</body>
</html>
